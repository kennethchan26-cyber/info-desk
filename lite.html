<header class="mast"><div class="brand"><span class="tag">LIVE</span>INFO<em>//</em>DESK <span class="tag">LITE</span></div><div class="clockbox"><div class="clock" id="clock">—:—:—</div><div class="date" id="date">香港時間 HKT</div></div></header>

<div class="layout">

 <div class="col right"><section class="panel weather"><div class="head"><h2>沙田天氣</h2><span class="page">香港天文台</span></div><div class="weather-main"><div class="temperature" id="temperature">—°</div><div class="weather-side"><span id="humidity">—%</span><small>相對濕度：天文台站</small></div></div><div class="condition" id="condition">—</div><div class="muted source" id="weatherSource">資料時間：—</div></section></div>
</div>
<div class="layout">
